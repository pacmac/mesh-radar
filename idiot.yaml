- id: messages-carry-timestamps-hours-in-the-future
  type: bug
  what: Rows in messages have ts up to ~20h ahead of now, so recent traffic sorts below them and looks
    missing
  spec: docs/modules/ws-relay.md
  files:
  - src/bridge-events.js
  - src/db.js
  test:
    command:
    - bash
    - -c
    - now=$(date +%s); n=$(sqlite3 data/node-dash.db "SELECT COUNT(*) FROM messages WHERE ts > $now;");
      echo "future_rows=$n"; [ "$n" -eq 0 ]
    criterion: no row in messages has ts greater than the moment the query runs
    runs: 1
  trial:
    file: .proofs/messages-carry-timestamps-hours-in-the-future.trial.txt
    exit: 0
    runs: 1
    failures: 0
    at: '2026-10-11T04:27:36.489'
    commit: 9dc008b-dirty
  fix: null
  ruling:
    by: peter
    why: 'Does not reproduce now: 0 rows with ts in the future against 444 real rows in the last 30 days,
      max ts ~10.7h in the past. Acquitted so db.js unlocks for unrelated work; if it recurs, re-file
      with the specific window.'
    at: '2026-10-11T06:42:58.432'
