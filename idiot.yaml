  what: "node-dash resolves channels locally, holding PSKs and per-radio indices it must not know \u2014\
    \ the gateway owns resolution and our two radios disagree (private is 2 on OMNI, 1 on YAGI)"
  spec: docs/modules/channels.md
  files:
  - src/channels.js
  - src/mesh-send.js
  - src/messages-api.js
  - src/automation.js
  - src/callout.js
  - src/resolve.js
  - src/ws-relay.js
  - src/config-api.js
  test:
    command:
    - node
    - tests/test_no_channel_resolver.mjs
    criterion: no src file references the resolver or reads a channel name/psk, and src/channels.js does
      not exist
    runs: 1
  trial:
