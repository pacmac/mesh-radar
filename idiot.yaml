- id: reply-timestamps-precede-their-command-two-radio-clocks
  type: bug
  what: "336 replies carry a ts earlier than the command they answer, because ts is the receiving radio's\
    \ clock and our two radios differ by ~1s \u2014 so a pong renders above its own ping"
  spec: docs/modules/tab-messages.md
  files:
  - src/bridge-events.js
  - src/db.js
  - src/filters.js
  test:
    command: null
    criterion: no message has a ts earlier than the message its reply_id points at
    runs: 1
  trial: null
  fix: null
- id: no-independent-millisecond-record-of-the-exchange
  type: new
  what: 'node-dash cannot give a second verdict on a device exchange: every timestamp is integer SECONDS
    and comes from the radio''s rx_time, so nothing records our own clock and a 15-min beat specified
    to +/-10ms cannot be measured'
  spec: docs/modules/exchange-capture.md
  files:
  - src/bridge-events.js
  - src/db.js
  - src/ws-relay.js
  test:
    command: null
    criterion: each received packet carries node-dash's own arrival time at ms resolution alongside the
      gateway's rx_time, per receiving radio
    runs: 1
  trial: null
  fix: null
