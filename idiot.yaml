- id: radar-terrain-retry-loop-wedges-browser
  type: bug
  what: 'app-radar.js''s _drawRadarTerrain() retries _loadTerrain() on every drawRadar() call while terrainData
    is null (never sampled), and the retry''s .finally() calls drawRadar() again, re-entering _drawRadarTerrain()
    in a cycle with no backoff or one-shot guard. On a fresh deployment where terrain has never been sampled
    (confirmed on the Pi: no operator has ever run POST /terrain/sample there), this is an unthrottled
    recursive async retry that starves the browser''s event loop completely -- confirmed live via Playwright,
    even a trivial page.evaluate(''1+1'') hung on /radar while the root page and a raw WS connection both
    worked fine. Likely the real cause of ''the page won''t load at all''.'
