      curl -s http://192.168.10.205:8000/device-config/FC:0A:85:C6:EC:B7 | python3 -c "

      import json,sys

      d=json.load(sys.stdin)

      print(\"is_rotator=\", d[\"is_rotator\"], \"label=\", d[\"label\"])

