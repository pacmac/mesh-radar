- id: ws-relay-no-dead-peer-detection
  type: bug
  what: ws-relay.js's WS server (wss.on('connection', ...)) has no ping/pong heartbeat anywhere. A half-open
    client connection (laptop sleep, flaky wifi, a NAT/router dropping the session without a clean FIN)
    leaves ws.readyState stuck at 1 (OPEN) forever on the server side. Every broadcast() call and every
    per-connection push (node_list, radar, snapshot, etc.) checks readyState===1 and sends -- which is
    true for a zombie connection -- so data keeps queuing into that dead socket's write buffer with nothing
    ever draining it on the wire. This is the leading suspect for node-dash's RSS growing from ~100MB
    to 777MB over ~15h on the Pi deployment, which then caused an SQLite WAL-lock livelock under memory
    pressure (observed directly via strace; a systemctl restart recovered it instantly).
  spec: docs/modules/ws-relay.md
  files:
  - src/ws-relay.js
  test:
    command:
    - node
    - tests/test_ws_relay_heartbeat.mjs
    criterion: pruneDeadConnections() exists, correctly sweeps dead (isAlive=false) vs live connections,
      and is wired into both wss and wssDevice connection handlers + interval sweeps
    runs: 1
  trial:
    file: .proofs/ws-relay-no-dead-peer-detection.trial.txt
    exit: 1
    runs: 1
    failures: 1
