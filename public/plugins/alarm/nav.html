<!-- ALARM PLUGIN — sidebar contributions. NOT CORE.
     Rendered into core's generic nav marker. With the plugin
     unwired this file is never read and the sidebar simply has no Control
     entry and no alarm device shortcuts — no empty section, no dead x-if.
     See docs/BROWSER_PLUGIN_SPEC.md. -->
        <li x-show="pacHostStatus?.available">
          <details :open="tab==='control'">
            <summary @click.prevent="setNav('control')">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              Control
            </summary>
            <ul>
              <li><a :class="tab==='control'&&controlTab==='summary'&&'active'" @click="setNav('control','summary')">Summary</a></li>
              <li><a :class="tab==='control'&&controlTab==='command'&&'active'" @click="setNav('control','command')">Command</a></li>
              <li><a :class="tab==='control'&&controlTab==='camera'&&'active'"  @click="setNav('control','camera')">Camera</a></li>
              <li><a :class="tab==='control'&&controlTab==='config'&&'active'"  @click="setNav('control','config')">Config</a></li>
              <li><a :class="tab==='control'&&controlTab==='stats'&&'active'"   @click="setNav('control','stats')">Stats</a></li>
              <li><a :class="tab==='control'&&controlTab==='align'&&'active'"   @click="setNav('control','align')">Yagi Align</a></li>
              <li><a :class="tab==='control'&&controlTab==='chat'&&'active'"    @click="setNav('control','chat')">Chat</a></li>
            </ul>
          </details>
        </li>
        <!-- pac-host alarm devices — server-pushed roster (GET /mesh/devices
             via controlDevices(), already ours-only), each links to the node
             focus page like any other node. Empty when pac-host is
             unavailable, no separate x-show gate needed. Deliberately NOT the
             general favourites list (task devices-shortcut-source, 2026-07-25
             — Peter: "it should come from dev1/devices", after spotting an
             unrelated starred node here). Favourites itself is untouched
             elsewhere (still used by Align's target picker, app-align.js). -->
        <template x-for="d in controlDevices()" :key="d.num">
          <li>
            <!-- min-w-0 on the flex parent is required for truncate to work
                 on the child: without it the flex item refuses to shrink below
                 its content width and the name overflows the 14rem sidebar. -->
            <a class="min-w-0"
               :class="tab==='node' && nodeStatusNum===d.num && 'active'"
               :title="d.label"
               @click="openNodeStatusPage(d.num)">
              <span class="inline-block w-2 h-2 rounded-full shrink-0"
                    :class="d.present ? 'bg-success' : 'bg-base-content/30'"></span>
              <span class="truncate" x-text="d.label"></span>
            </a>
          </li>
        </template>
