<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yagi Align</title>
<script>
  (function () {
    var query = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(event) {
      document.documentElement.setAttribute('data-theme', event.matches ? 'business' : 'corporate');
    }
    applyTheme(query);
    if (query.addEventListener) query.addEventListener('change', applyTheme);
    else if (query.addListener) query.addListener(applyTheme);
  }());
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%22.9em%22 font-size=%2220%22>📡</text></svg>">
<link href="/vendor/daisyui-4.12.14.min.css" rel="stylesheet" type="text/css">
<script src="/vendor/tailwindcss-3.4.17.js"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: {
    display: ['Oxanium', 'system-ui', 'sans-serif'],
    body:    ['"DM Sans"', 'system-ui', 'sans-serif'],
    mono:    ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
  } } } };
</script>
<link rel="stylesheet" href="/align.css?v=native-1">
<script defer src="/app-align.js?v=native-rest-2"></script>
<style>
  html, body { width: 100%; max-width: 100%; height: 100%; overflow: hidden; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
</style>
</head>
<body class="bg-base-200 font-body">

<div class="flex flex-col h-full min-w-0 gap-3 p-3"
     style="padding-top:calc(0.75rem + env(safe-area-inset-top));padding-right:calc(0.75rem + env(safe-area-inset-right));padding-bottom:calc(0.75rem + env(safe-area-inset-bottom));padding-left:calc(0.75rem + env(safe-area-inset-left))">

  <div class="grid grid-cols-2 sm:grid-cols-[minmax(0,1fr)_auto_auto] gap-2 shrink-0 min-w-0">
    <div class="col-span-2 sm:col-span-1 flex items-center gap-2 min-w-0">
      <select id="align-target" class="select select-bordered flex-1 min-w-0 font-display"
              disabled aria-label="Node to align">
        <option value="">Star a node to align it</option>
      </select>
      <span id="align-status" class="badge badge-ghost shrink-0 font-display">LOADING</span>
    </div>
    <label class="join w-full min-w-0 sm:w-auto" title="Pings to average per reading">
      <span class="join-item btn btn-disabled no-animation shrink-0 font-display text-xs">avg</span>
      <select id="align-burst-size"
              class="join-item select select-bordered flex-1 min-w-0 sm:flex-none font-mono" disabled>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
      </select>
    </label>
    <label class="join w-full min-w-0 sm:w-auto" title="Seconds to wait for a reply (persisted)">
      <span class="join-item btn btn-disabled no-animation shrink-0 font-display text-xs">wait s</span>
      <input id="align-reply-window" type="number" min="5" max="120" step="5" value="30"
             inputmode="numeric"
             class="join-item input input-bordered flex-1 min-w-0 sm:flex-none sm:w-16 font-mono"
             disabled>
    </label>
  </div>

  <div id="align-warning" class="alert alert-warning py-2 text-sm shrink-0" hidden></div>

  <div id="align-current-card" class="card bg-base-100 shadow-sm border-2 border-base-300 shrink-0">
    <div class="card-body py-4 gap-1 items-center text-center">
      <div id="align-current-empty" class="py-4 text-base-content/50 text-sm">
        Press PING to take a reading.
      </div>

      <div id="align-current" class="flex flex-col items-center gap-1 w-full" hidden>
        <div class="flex items-baseline gap-2">
          <span id="align-quality" class="text-6xl font-mono font-bold tabular-nums leading-none"></span>
          <span class="text-lg text-base-content/50">%</span>
        </div>
        <div id="align-quality-label" class="text-2xl font-display font-semibold"></div>

        <div class="text-xs font-mono text-base-content/50">
          via <span id="align-tx"></span>
          · ±<span id="align-spread"></span>
          · <span id="align-got"></span>/<span id="align-of"></span> pings
        </div>

        <div id="align-trend" class="text-lg font-display font-semibold mt-1"></div>
        <div><span id="align-best-line"></span></div>

        <div class="text-xs font-mono text-base-content/40 mt-1">
          YAGI <span id="align-yagi-quality">—</span>
          · OMNI <span id="align-omni-quality">—</span>
          &nbsp;·&nbsp; <span id="align-rssi"></span> dBm /
          <span id="align-snr"></span> dB
        </div>
      </div>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm border border-base-300 flex-1 min-h-0">
    <div class="card-body py-3 px-3 gap-2 flex flex-col min-h-0">
      <div class="flex items-baseline justify-between shrink-0">
        <h2 class="text-xs font-display font-semibold uppercase tracking-wider text-base-content/50">Every reading</h2>
        <span class="text-xs text-base-content/40">tallest = strongest · ★ best</span>
      </div>

      <div id="align-readings-empty"
           class="flex-1 flex items-center justify-center text-sm text-base-content/40 text-center px-4">
        Point the antenna, then press PING. Each press averages
        <span id="align-readings-empty-n" class="mx-1 font-mono">4</span>
        pings into one reading.
      </div>

      <div id="align-readings"
           class="flex-1 min-h-0 flex items-stretch gap-1.5 overflow-x-auto pt-1" hidden></div>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-2 shrink-0">
    <button id="align-ping"
            class="btn btn-lg btn-disabled col-span-2 font-display text-lg" disabled>
      <span id="align-ping-idle">PING</span>
      <span id="align-ping-active" class="flex items-center gap-2" hidden>
        <span class="loading loading-spinner loading-sm"></span>
        <span id="align-ping-progress">GATHERING 0/0</span>
      </span>
    </button>
    <button id="align-end" class="btn btn-lg btn-outline font-display" disabled>End</button>
  </div>

</div>
</body>
</html>
