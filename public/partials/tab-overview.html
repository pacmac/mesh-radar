        <!-- ===================== OVERVIEW ===================== -->
        <div x-show="tab==='overview'" class="flex-1 min-h-0 flex flex-col gap-4 overflow-hidden">

          <div class="stats stats-vertical sm:stats-horizontal shadow bg-base-100 shrink-0">
            <div class="stat">
              <div class="stat-title">Device</div>
              <div class="stat-value" x-text="primaryDevBleState.long_name || '–'"></div>
              <div class="stat-desc" x-text="[primaryDevBleState.hw_model, primaryDevBleState.firmware_version].filter(Boolean).join(' · ')"></div>
            </div>
            <div class="stat">
              <div class="stat-title">Battery</div>
              <div class="stat-value" x-text="(primaryDevBleState.battery_level ?? '–') + '%'"></div>
              <div class="stat-desc" x-text="primaryDevBleState.voltage != null ? (Number(primaryDevBleState.voltage).toFixed(2) + ' V') : ''"></div>
            </div>
            <div class="stat">
              <div class="stat-title">Uptime</div>
              <div class="stat-value" x-text="fmtUptime(primaryDevBleState.uptime_s)"></div>
              <div class="stat-desc">since last boot</div>
            </div>
            <div class="stat">
              <div class="stat-title">Channel Util</div>
              <div class="stat-value" x-text="(primaryDevBleState.channel_utilization != null ? Number(primaryDevBleState.channel_utilization).toFixed(1) : '–') + '%'"></div>
              <div class="stat-desc" x-text="'air tx ' + (primaryDevBleState.air_util_tx != null ? Number(primaryDevBleState.air_util_tx).toFixed(2) : '–') + '%'"></div>
            </div>
            <div class="stat">
              <div class="stat-title">Mesh Nodes</div>
              <div class="stat-value" x-text="(nodeCount ?? '–') + ' shown'"></div>
              <div class="stat-desc" x-text="(nodeTotal != null ? nodeTotal + ' total' : '–')"></div>
            </div>
            <div class="stat">
              <div class="stat-title">Config</div>
              <div class="stat-value" :class="primaryDevBleState.ble_state === 'ready' ? 'text-success' : 'text-warning'" x-text="primaryDevBleState.ble_state === 'ready' ? 'complete' : 'syncing…'"></div>
              <div class="stat-desc" x-text="(primaryDevBleState.node_count ?? 0) + ' in radio nodedb'"></div>
            </div>
          </div>

          <!-- Row 1: Mast Tilt + Env History -->
          <div class="flex-1 min-h-0 grid lg:grid-cols-2 gap-4">

          <!-- Mast Tilt Radar (half width) -->
          <div class="instrument flex flex-col h-full" x-show="nodeSelf.tilt">
            <!-- header -->
            <div class="instrument-header">
              <span class="instrument-label">Mast Tilt</span>
              <!-- cal state indicator -->
              <span x-show="tiltNorthAngle != null" class="instrument-faint font-mono text-xs tracking-wider">● N CAL</span>
              <span x-show="tiltZero && tiltNorthAngle == null" class="instrument-value--amber font-mono text-xs tracking-wider opacity-70">● ZEROED</span>
              <span class="ml-auto instrument-faint font-mono text-xs" x-text="tiltHistory.length + ' pts'"></span>
              <!-- time window -->
              <div class="flex gap-1">
                <template x-for="w in [1,4,24]">
                  <button @click="tiltWindow=w; persistSet('tiltWindow',w)"
                          class="instrument-btn"
                          :class="tiltWindow===w && 'instrument-btn--active'"
                          x-text="w+'H'"></button>
                </template>
              </div>
              <!-- step 1: SET ZERO (mast plumb vertical) -->
              <button @click="tiltZero ? tiltClearCal() : tiltSetZero()"
                      class="instrument-btn"
                      :class="tiltZero && 'instrument-btn--red'"
                      :title="tiltZero ? 'Clear all calibration' : 'Step 1 — mast plumb vertical, press to set zero'"
                      x-text="tiltZero ? 'CLR CAL' : 'SET ZERO'"></button>
              <!-- step 2: SET NORTH (only after zero; hold antenna north then press) -->
              <button x-show="tiltZero && tiltNorthAngle == null"
                      @click="tiltSetNorth()"
                      class="instrument-btn instrument-btn--amber"
                      title="Step 2 — hold antenna pointing north, then press">SET NORTH</button>
            </div>
            <!-- body -->
            <div class="instrument-screen flex gap-4 p-4 flex-1 min-h-0 overflow-hidden">
              <!-- SVG radar — grows to fill card height -->
              <div class="flex-1 min-w-0 min-h-0 self-center" style="aspect-ratio:1/1;max-height:100%">
                <svg viewBox="0 0 300 300" class="w-full h-full">
                  <defs>
                    <filter id="tilt-glow" x="-60%" y="-60%" width="220%" height="220%">
                      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                  </defs>
                  <!-- rings: 4 explicit circles (x-for doesn't work on SVG elements) -->
                  <circle cx="150" cy="150" :r="tiltLogPx(tiltRings[0])" fill="none" stroke="var(--phos)" stroke-opacity="0.75" stroke-width="1.5"/>
                  <circle cx="150" cy="150" :r="tiltLogPx(tiltRings[1])" fill="none" stroke="var(--phos)" stroke-opacity="0.50" stroke-width="1"/>
                  <circle cx="150" cy="150" :r="tiltLogPx(tiltRings[2])" fill="none" stroke="var(--phos)" stroke-opacity="0.50" stroke-width="1"/>
                  <circle cx="150" cy="150" :r="tiltLogPx(tiltRings[3])" fill="none" stroke="var(--phos)" stroke-opacity="0.70" stroke-width="1.5"/>
                  <!-- crosshairs -->
                  <line x1="150" y1="18" x2="150" y2="282" stroke="var(--phos)" stroke-opacity="0.07" stroke-width="1"/>
                  <line x1="18"  y1="150" x2="282" y2="150" stroke="var(--phos)" stroke-opacity="0.07" stroke-width="1"/>
                  <!-- compass bearing ticks (30° intervals, shown when north-calibrated) -->
                  <path x-show="tiltNorthAngle != null"
                        :d="tiltTicksMinorPath()"
                        stroke="var(--phos)" stroke-opacity="0.22" stroke-width="1" fill="none"/>
                  <path x-show="tiltNorthAngle != null"
                        :d="tiltTicksMajorPath()"
                        stroke="var(--phos)" stroke-opacity="0.45" stroke-width="1.5" fill="none"/>
                  <!-- ring labels: 4 explicit text elements -->
                  <text :x="153 + tiltLogPx(tiltRings[0])" y="147" text-anchor="start" font-size="10" fill="var(--phos)" fill-opacity="0.50" font-family="monospace" x-text="tiltRings[0]+'°'"></text>
                  <text :x="153 + tiltLogPx(tiltRings[1])" y="147" text-anchor="start" font-size="10" fill="var(--phos)" fill-opacity="0.45" font-family="monospace" x-text="tiltRings[1]+'°'"></text>
                  <text :x="153 + tiltLogPx(tiltRings[2])" y="147" text-anchor="start" font-size="10" fill="var(--phos)" fill-opacity="0.45" font-family="monospace" x-text="tiltRings[2]+'°'"></text>
                  <text :x="153 + tiltLogPx(tiltRings[3])" y="147" text-anchor="start" font-size="10" fill="var(--phos)" fill-opacity="0.50" font-family="monospace" x-text="tiltRings[3]+'°'"></text>
                  <!-- axis labels -->
                  <g x-show="tiltNorthAngle == null">
                    <text x="150" y="14"  text-anchor="middle" font-size="10" fill="var(--phos)" fill-opacity="0.60" font-family="monospace">P+</text>
                    <text x="150" y="292" text-anchor="middle" font-size="10" fill="var(--phos)" fill-opacity="0.50" font-family="monospace">P−</text>
                    <text x="286" y="154" text-anchor="end"    font-size="10" fill="var(--phos)" fill-opacity="0.50" font-family="monospace">R+</text>
                    <text x="14"  y="154" text-anchor="start"  font-size="10" fill="var(--phos)" fill-opacity="0.50" font-family="monospace">R−</text>
                  </g>
                  <g x-show="tiltNorthAngle != null">
                    <text x="150" y="14"  text-anchor="middle" font-size="10" fill="var(--phos)" fill-opacity="0.85" font-family="monospace" font-weight="bold">N</text>
                    <text x="150" y="292" text-anchor="middle" font-size="10" fill="var(--phos)" fill-opacity="0.60" font-family="monospace">S</text>
                    <text x="286" y="154" text-anchor="end"    font-size="10" fill="var(--phos)" fill-opacity="0.60" font-family="monospace">E</text>
                    <text x="14"  y="154" text-anchor="start"  font-size="10" fill="var(--phos)" fill-opacity="0.60" font-family="monospace">W</text>
                  </g>
                  <!-- history trace -->
                  <polyline :points="tiltPolylinePoints()" fill="none" stroke="var(--phos)" stroke-opacity="0.20" stroke-width="1"/>
                  <!-- recent fade dots -->
                  <g x-html="tiltDotsSvg('rgba(0,255,80,1)', 0.55)"></g>
                  <!-- peak ring (amber) -->
                  <circle x-show="tiltPeak > 0.05" cx="150" cy="150"
                          :r="tiltLogPx(tiltPeak)" fill="none"
                          stroke="var(--trace-amber)" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4,3"/>
                  <!-- live dot with glow -->
                  <circle :cx="tiltToSvg(nodeSelf.tilt?.pitch??0, nodeSelf.tilt?.roll??0).x"
                          :cy="tiltToSvg(nodeSelf.tilt?.pitch??0, nodeSelf.tilt?.roll??0).y"
                          r="7" fill="var(--phos)" fill-opacity="0.95" filter="url(#tilt-glow)"
                          style="transition:cx 0.5s,cy 0.5s"/>
                  <!-- centre pip -->
                  <circle cx="150" cy="150" r="2.5" fill="var(--phos)" fill-opacity="0.5"/>
                </svg>
              </div>
              <!-- readout -->
              <div class="flex flex-col gap-2 min-w-[6rem] font-mono">
                <div class="grid grid-cols-[auto_auto] gap-x-3 gap-y-0.5 items-baseline">
                  <span class="instrument-faint text-xs tracking-wider">ROLL</span>
                  <span class="instrument-value text-sm text-right" x-text="(tiltApplyZero(nodeSelf.tilt?.pitch??0,nodeSelf.tilt?.roll??0).roll).toFixed(2)+'°'"></span>
                  <span class="instrument-faint text-xs tracking-wider">PITCH</span>
                  <span class="instrument-value text-sm text-right" x-text="(tiltApplyZero(nodeSelf.tilt?.pitch??0,nodeSelf.tilt?.roll??0).pitch).toFixed(2)+'°'"></span>
                  <span class="instrument-faint text-xs tracking-wider">TOTAL</span>
                  <span class="instrument-value text-sm text-right" x-text="(()=>{ const z=tiltApplyZero(nodeSelf.tilt?.pitch??0,nodeSelf.tilt?.roll??0); return Math.sqrt(z.pitch**2+z.roll**2).toFixed(2)+'°'; })()"></span>
                  <span class="instrument-value--amber text-xs tracking-wider opacity-60">PEAK</span>
                  <span class="instrument-value--amber text-sm text-right" x-text="tiltPeak.toFixed(2)+'°'"></span>
                </div>
                <div class="grid grid-cols-[auto_auto] gap-x-2.5 gap-y-0.5 instrument-faint text-xs pt-1.5 instrument-divider">
                  <span>x</span><span class="text-right" x-text="(nodeSelf.tilt?.x??0).toFixed(3)+' g'"></span>
                  <span>y</span><span class="text-right" x-text="(nodeSelf.tilt?.y??0).toFixed(3)+' g'"></span>
                  <span>z</span><span class="text-right" x-text="(nodeSelf.tilt?.z??0).toFixed(3)+' g'"></span>
                </div>
                <div class="instrument-faint text-xs pt-1 instrument-divider"
                     x-text="'rings: '+tiltRings.join(' / ')+'°'"></div>
              </div>
            </div>
          </div>

          <!-- Env History chart (half width, next to tilt) -->
          <div class="instrument flex flex-col h-full" x-show="nodeSelf.environment_metrics">
            <!-- header -->
            <div class="instrument-header">
              <span class="instrument-label">Enclosure Environment</span>
              <span class="ml-auto instrument-faint font-mono text-xs"
                    x-text="(envHistory[activeNodeId]?.length ?? 0) + ' pts'"></span>
              <template x-for="w in [6, 24, 72]">
                <button @click="envWindow=w; persistSet('envWindow',w); loadEnvHistory(activeNodeId)"
                        class="instrument-btn"
                        :class="envWindow===w && 'instrument-btn--active'"
                        x-text="w+'H'"></button>
              </template>
            </div>
            <!-- body -->
            <div class="instrument-screen flex-1 flex flex-col min-h-0 p-4">
              <!-- live readings -->
              <div class="flex gap-6 mb-4 shrink-0 flex-wrap">
                <div>
                  <div class="instrument-label instrument-value--red opacity-60">Temp</div>
                  <div class="instrument-value--red text-2xl font-mono font-bold tabular-nums" x-text="nodeSelf.environment_metrics?.temperature?.toFixed(1) + ' °C'"></div>
                </div>
                <div>
                  <div class="instrument-label instrument-value--amber opacity-60">Humidity</div>
                  <div class="instrument-value--amber text-2xl font-mono font-bold tabular-nums" x-text="nodeSelf.environment_metrics?.relative_humidity?.toFixed(1) + ' %'"></div>
                </div>
                <div>
                  <div class="instrument-label opacity-60">Dew Pt</div>
                  <div class="text-2xl font-mono font-bold tabular-nums"
                       :class="dewPoint(nodeSelf.environment_metrics?.temperature, nodeSelf.environment_metrics?.relative_humidity) >= nodeSelf.environment_metrics?.temperature - 3 ? 'instrument-value--red' : 'instrument-value'"
                       x-text="dewPoint(nodeSelf.environment_metrics?.temperature, nodeSelf.environment_metrics?.relative_humidity)?.toFixed(1) + ' °C'"></div>
                </div>
                <div x-show="nodeSelf.environment_metrics?.barometric_pressure != null">
                  <div class="instrument-label opacity-60">Pressure</div>
                  <div class="instrument-faint text-2xl font-mono font-bold tabular-nums" x-text="nodeSelf.environment_metrics?.barometric_pressure?.toFixed(1) + ' hPa'"></div>
                </div>
                <div x-show="dewPoint(nodeSelf.environment_metrics?.temperature, nodeSelf.environment_metrics?.relative_humidity) >= nodeSelf.environment_metrics?.temperature - 3"
                     class="instrument-value--red text-sm font-mono self-end">⚠ condensation risk</div>
              </div>
              <!-- history chart -->
              <div class="flex-1 min-h-0 flex flex-col" x-show="(envHistory[activeNodeId]?.length ?? 0) > 1">
                <svg viewBox="0 0 420 250" class="w-full flex-1 block" preserveAspectRatio="none">
                  <!-- border -->
                  <rect x="36" y="18" width="348" height="200" fill="none" stroke="var(--phos)" stroke-opacity="0.10" stroke-width="0.5"/>
                  <!-- horizontal grid lines -->
                  <line x1="36" y1="68"  x2="384" y2="68"  stroke="var(--phos)" stroke-opacity="0.07" stroke-width="0.6" stroke-dasharray="3,3"/>
                  <line x1="36" y1="118" x2="384" y2="118" stroke="var(--phos)" stroke-opacity="0.07" stroke-width="0.6" stroke-dasharray="3,3"/>
                  <line x1="36" y1="168" x2="384" y2="168" stroke="var(--phos)" stroke-opacity="0.07" stroke-width="0.6" stroke-dasharray="3,3"/>
                  <!-- vertical grid lines -->
                  <line x1="123" y1="18" x2="123" y2="218" stroke="var(--phos)" stroke-opacity="0.07" stroke-width="0.6" stroke-dasharray="3,3"/>
                  <line x1="210" y1="18" x2="210" y2="218" stroke="var(--phos)" stroke-opacity="0.07" stroke-width="0.6" stroke-dasharray="3,3"/>
                  <line x1="297" y1="18" x2="297" y2="218" stroke="var(--phos)" stroke-opacity="0.07" stroke-width="0.6" stroke-dasharray="3,3"/>
                  <!-- axis labels -->
                  <g x-html="envChartYLabels(activeNodeId)"></g>
                  <g x-html="envChartRhLabels(activeNodeId)"></g>
                  <g x-html="envChartXLabels(activeNodeId)"></g>
                  <!-- data lines -->
                  <polyline :points="envHumPoints(activeNodeId)" fill="none" stroke="var(--trace-amber)" stroke-opacity="0.85" stroke-width="1.2"/>
                  <polyline :points="envDpPoints(activeNodeId)"  fill="none" stroke="var(--phos)" stroke-opacity="0.70" stroke-width="1.2" stroke-dasharray="4,2"/>
                  <polyline :points="envTempPoints(activeNodeId)" fill="none" stroke="var(--trace-red)" stroke-opacity="0.85" stroke-width="1.2"/>
                </svg>
              </div>
              <div class="flex-1 flex items-center justify-center instrument-faint font-mono text-xs"
                   x-show="(envHistory[activeNodeId]?.length ?? 0) <= 1">
                waiting for history…
              </div>
            </div>
          </div>

          </div><!-- end row 1: tilt + env -->

          <!-- Row 2: Live Feed (full width) -->
          <div class="flex-1 min-h-0 flex flex-col gap-4">

          <!-- Live Event Feed -->
          <div class="card bg-base-100 shadow flex flex-col h-full overflow-hidden">
            <div class="card-body flex flex-col flex-1 min-h-0 py-3">
              <div class="flex items-center justify-between mb-1">
                <h2 class="card-title">Live Event Feed</h2>
                <div class="dropdown dropdown-end">
                  <label tabindex="0" class="btn btn-sm btn-ghost gap-1 opacity-70 hover:opacity-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/></svg>
                    Filter
                    <span x-show="feedVisible.length < feedFilterOptions.length" class="badge badge-warning badge-xs" x-text="feedFilterOptions.length - feedVisible.length"></span>
                  </label>
                  <ul tabindex="0" class="dropdown-content z-10 p-2 shadow-lg bg-base-100 border border-base-300 rounded-box w-48 flex flex-col gap-0.5 mt-1">
                    <template x-for="opt in feedFilterOptions" :key="opt.id">
                      <li>
                        <label class="flex items-center gap-2 cursor-pointer hover:bg-base-200 rounded px-2 py-1">
                          <input type="checkbox" class="checkbox checkbox-xs"
                                 name="feedVisible" :value="opt.id"
                                 x-model="feedVisible">
                          <span class="text-sm" x-text="opt.label"></span>
                        </label>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>
              <div class="flex-1 min-h-0 overflow-y-auto font-mono text-sm flex flex-col gap-1" x-ref="feed">
                <template x-for="(ev, i) in filteredFeedEvents()" :key="i">
                  <div class="flex gap-2 items-start border-b border-base-200 pb-1">
                    <span class="font-mono text-xs text-base-content/40 shrink-0 pt-0.5" x-text="ev.time"></span>
                    <span class="badge badge-sm" :class="badgeForType(ev.type)" x-text="ev.type"></span>
                    <span x-show="ev.device" x-html="radioBadge(ev.device, 'shrink-0')"></span>
                    <span class="text-base-content/80" x-text="ev.summary"></span>
                  </div>
                </template>
                <div x-show="events.length===0" class="text-base-content/40 italic">Waiting for events…</div>
              </div>
            </div>
          </div>

          </div><!-- end row 2: live feed -->

        </div>
