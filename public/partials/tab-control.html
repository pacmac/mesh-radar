        <!-- ===================== CONTROL (pac-host units) ===================== -->
        <div x-show="tab==='control'" class="flex-1 min-h-0 flex flex-col gap-4 overflow-hidden">
          <div class="tabs tabs-bordered grid grid-cols-6 w-full sm:w-fit shrink-0">
            <a class="tab px-1 sm:px-4 text-xs sm:text-sm" :class="controlTab==='summary' && 'tab-active font-semibold'" @click="switchControlTab('summary')">Summary</a>
            <a class="tab px-1 sm:px-4 text-xs sm:text-sm" :class="controlTab==='command' && 'tab-active font-semibold'" @click="switchControlTab('command')">Command</a>
            <a class="tab px-1 sm:px-4 text-xs sm:text-sm" :class="controlTab==='config'  && 'tab-active font-semibold'" @click="switchControlTab('config')">Config</a>
            <a class="tab px-1 sm:px-4 text-xs sm:text-sm" :class="controlTab==='stats'   && 'tab-active font-semibold'" @click="switchControlTab('stats')">Stats</a>
            <a class="tab px-1 sm:px-4 text-xs sm:text-sm" :class="controlTab==='align'   && 'tab-active font-semibold'" @click="switchControlTab('align')">Yagi Align</a>
            <a class="tab px-1 sm:px-4 text-xs sm:text-sm" :class="controlTab==='chat'    && 'tab-active font-semibold'" @click="switchControlTab('chat')">Chat</a>
          </div>

          <!-- ==================== SUMMARY (skeleton) ==================== -->
          <div x-show="controlTab==='summary'" class="flex-1 min-h-0 max-w-2xl">
            <div class="card bg-base-100 shadow">
              <div class="card-body py-3">
                <h2 class="card-title">Summary</h2>
                <p class="text-xs text-base-content/50">Coming soon.</p>
              </div>
            </div>
          </div>

          <!-- ==================== COMMAND ==================== -->
          <div x-show="controlTab==='command'" class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1 min-h-0">
          <div class="card bg-base-100 shadow flex flex-col min-h-0">
            <div class="card-body flex flex-col min-h-0">
              <h2 class="card-title shrink-0">Command</h2>
              <div class="flex flex-col gap-3 overflow-y-auto flex-1 min-h-0">

                <!-- Unit picker -->
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-sm text-base-content/60 w-12 shrink-0">Unit</span>
                  <div class="join">
                    <template x-for="d in controlDevices()" :key="d.num">
                      <button class="join-item btn btn-sm"
                              :class="(controlTarget === d.num ? 'btn-primary' : 'btn-outline') + (d.present ? '' : ' opacity-60')"
                              :title="d.present ? '' : 'Not currently in the gateway roster (asleep) — commands still queue'"
                              @click="controlTarget = d.num"
                              x-text="d.label"></button>
                    </template>
                  </div>
                  <span x-show="!controlDevices().length" class="text-xs text-base-content/50 italic">
                    No pac-host units known — waiting for the service.
                  </span>
                </div>

                <!-- Shortcuts -->
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-sm text-base-content/60 w-12 shrink-0">Verb</span>
                  <div class="join">
                    <template x-for="v in controlShortcuts()" :key="v">
                      <button class="join-item btn btn-sm btn-outline"
                              :disabled="controlTarget == null || controlSending"
                              @click="sendControl(v)"
                              x-text="v"></button>
                    </template>
                  </div>
                </div>

                <!-- Free text -->
                <div class="flex items-center gap-2">
                  <input type="text" x-model="controlVerb" placeholder="custom verb…"
                         class="input input-bordered input-sm flex-1"
                         :disabled="controlTarget == null || controlSending"
                         @keydown.enter="sendControl()">
                  <button class="btn btn-sm btn-primary" :disabled="controlTarget == null || controlSending || !controlVerb.trim()"
                          @click="sendControl()">Send</button>
                </div>
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-4 min-h-0">
            <div class="card bg-base-100 shadow flex flex-col shrink-0" style="max-height:40%">
              <div class="card-body flex flex-col min-h-0">
                <h2 class="card-title shrink-0">Pending</h2>
                <div class="flex flex-col gap-3 overflow-y-auto flex-1 min-h-0">
                  <template x-for="entry in controlPending()" :key="entry.id">
                    <div class="bg-base-200 rounded-xl p-3 flex flex-col gap-2">
                      <div class="flex justify-between items-baseline gap-3">
                        <span class="text-sm font-mono tabular-nums"
                              x-text="entry.verb + (entry.args?.length ? ' ' + entry.args.join(' ') : '')"></span>
                        <span class="flex items-center gap-2 shrink-0">
                          <span class="text-xs font-mono text-base-content/50" x-text="entry.since"></span>
                          <span class="badge badge-sm badge-info" x-text="entry.status"></span>
                        </span>
                      </div>
                      <p x-show="entry.lastError" class="text-sm text-error" x-text="entry.lastError"></p>
                    </div>
                  </template>
                  <span x-show="controlTarget != null && !controlPending().length" class="text-sm text-base-content/50 italic">No pending commands.</span>
                </div>
              </div>
            </div>

            <div class="card bg-base-100 shadow flex flex-col flex-1 min-h-0">
              <div class="card-body flex flex-col min-h-0">
                <h2 class="card-title shrink-0">Executed</h2>
                <div class="flex flex-col gap-3 overflow-y-auto flex-1 min-h-0">
                  <template x-for="entry in controlExecuted()" :key="entry.id">
                    <div class="bg-base-200 rounded-xl p-3 flex flex-col gap-2">
                      <div class="flex justify-between items-baseline gap-3">
                        <span class="text-sm font-mono tabular-nums"
                              x-text="entry.verb + (entry.args?.length ? ' ' + entry.args.join(' ') : '')"></span>
                        <span class="flex items-center gap-2 shrink-0">
                          <span class="text-xs font-mono text-base-content/50" x-text="entry.since"></span>
                          <span class="badge badge-sm"
                                :class="{acked:'badge-success', cancelled:'badge-warning', failed:'badge-error'}[entry.status] || 'badge-ghost'"
                                x-text="entry.status"></span>
                        </span>
                      </div>
                      <!-- Receipt — §5 key-value rows (same pattern as tab-node.html's
                           value_grid). Field ids shown as-is: pac-host owns their
                           meaning, node-dash does not guess labels — see app-control.md. -->
                      <div x-show="entry.receipt" class="grid gap-x-6 gap-y-1 justify-start"
                           style="grid-template-columns:repeat(auto-fill,minmax(11rem,16rem))">
                        <template x-for="f in controlReceiptFields(entry.receipt)" :key="f.label">
                          <div class="flex items-baseline justify-between gap-3 border-b border-base-300 py-0.5">
                            <span class="text-xs text-base-content/50" x-text="f.label"></span>
                            <span class="text-sm font-mono tabular-nums" x-text="f.text"></span>
                          </div>
                        </template>
                      </div>
                      <p x-show="entry.lastError" class="text-sm text-error" x-text="entry.lastError"></p>
                    </div>
                  </template>
                  <span x-show="controlTarget != null && !controlExecuted().length" class="text-sm text-base-content/50 italic">No commands sent yet.</span>
                </div>
              </div>
            </div>
          </div>
          </div>

          <!-- ==================== CONFIG (skeleton) ==================== -->
          <div x-show="controlTab==='config'" class="flex-1 min-h-0 max-w-2xl">
            <div class="card bg-base-100 shadow">
              <div class="card-body py-3">
                <h2 class="card-title">Config</h2>
                <p class="text-xs text-base-content/50">Coming soon.</p>
              </div>
            </div>
          </div>

          <!-- ==================== STATS (skeleton) ==================== -->
          <div x-show="controlTab==='stats'" class="flex-1 min-h-0 max-w-2xl">
            <div class="card bg-base-100 shadow">
              <div class="card-body py-3">
                <h2 class="card-title">Stats</h2>
                <p class="text-xs text-base-content/50">Coming soon.</p>
              </div>
            </div>
          </div>

          <!-- ==================== YAGI ALIGN (skeleton) ==================== -->
          <div x-show="controlTab==='align'" class="flex-1 min-h-0 max-w-2xl">
            <div class="card bg-base-100 shadow">
              <div class="card-body py-3">
                <h2 class="card-title">Yagi Align</h2>
                <p class="text-xs text-base-content/50">Coming soon.</p>
              </div>
            </div>
          </div>

          <!-- ==================== CHAT (skeleton) ==================== -->
          <div x-show="controlTab==='chat'" class="flex-1 min-h-0 max-w-2xl">
            <div class="card bg-base-100 shadow">
              <div class="card-body py-3">
                <h2 class="card-title">Chat</h2>
                <p class="text-xs text-base-content/50">Coming soon.</p>
              </div>
            </div>
          </div>
        </div>
