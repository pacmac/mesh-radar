<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mesh radar</title>
<script>
  (function() {
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'business' : 'corporate');
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      document.documentElement.setAttribute('data-theme', e.matches ? 'business' : 'corporate');
    });
  })();
  // NO SERVICE WORKER — a service worker is a cache, and nothing here is cached
  // (docs/modules/no-cache.md). New visitors must never install one.
  //
  // Existing installs are NOT reached by removing this line: they keep running
  // until the browser re-fetches /sw.js, which is now a kill switch that deletes
  // every cache and unregisters itself. That is why /sw.js still exists. This
  // unregister is the belt to its braces, for a tab that has one but never
  // navigates.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(rs => rs.forEach(r => r.unregister()))
      .catch(() => {});
  }
</script>

<style>
  /* Reusable node avatar — set size via --sz custom property or modifier class.
     font-size is derived as 32% of --sz so 4-char names always fit. */
  .node-avatar {
    --sz: 2.25rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 700;
    color: white;
    width: var(--sz);
    height: var(--sz);
    font-size: calc(var(--sz) * 0.32);
    flex-shrink: 0;
    line-height: 1;
    user-select: none;
  }
  .node-avatar-sm { --sz: 1.75rem; }
  .node-avatar-lg { --sz: 2.75rem; }
  [x-cloak] { display: none !important; }
</style>

</head>
<body class="h-screen overflow-hidden bg-base-200">

<div class="drawer h-screen" :class="sidebarPinned ? 'lg:drawer-open' : ''" x-data="dashboard()" x-init="init()">
  <input id="nav-drawer" type="checkbox" class="drawer-toggle" x-model="drawerOpen" />

  <!-- ===================== DRAWER CONTENT ===================== -->
  <div class="drawer-content flex flex-col h-screen overflow-hidden">

    <!-- Top navbar -->
    <div class="navbar min-h-0 py-1.5 bg-base-100 shadow-md sticky top-0 z-50 px-3">

      <!-- LEFT: sidebar toggle + rotator mode buttons -->
      <div class="flex-none flex items-center gap-2">
        <!-- Mobile hamburger -->
        <label for="nav-drawer" class="btn btn-square btn-ghost lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-5 h-5 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </label>
        <!-- Desktop expand (only when sidebar collapsed) -->
        <button class="btn btn-square btn-ghost hidden" :class="!sidebarPinned && 'lg:flex'"
                @click="sidebarPinned = true; persistSet('sidebarPinned', true)" title="Expand sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-5 h-5 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <!-- Rotator mode buttons (always visible when rotator known) -->
        <div class="hidden sm:flex items-center gap-1.5 pl-1" x-show="rotatorConnected || scanMode">
          <span class="inline-block w-1.5 h-1.5 rounded-full shrink-0"
                :class="rotatorConnected ? 'bg-success animate-pulse' : 'bg-error opacity-60'"></span>
          <div class="flex gap-0.5">
            <button class="btn btn-xs font-mono tracking-widest px-2"
                    :class="rotatorMode === 0 && !scanMode ? 'btn-outline btn-info' : 'btn-ghost opacity-40'"
                    :disabled="scanMode"
                    @click="setRotatorMode(0)">PASV</button>
            <button class="btn btn-xs font-mono tracking-widest px-2"
                    :class="rotatorMode === 1 && !scanMode ? 'btn-error' : 'btn-ghost opacity-40'"
                    :disabled="scanMode"
                    @click="setRotatorMode(1)">ACTV</button>
            <button class="btn btn-xs font-mono tracking-widest px-2"
                    :class="scanMode ? 'btn-warning btn-outline' : 'btn-ghost opacity-40'"
                    :disabled="!rotatorConnected || !rotatorDeviceId()"
                    @click="scanMode ? abortScan() : startScan()"
                    x-text="scanMode ? 'ABORT' : 'SCAN'"></button>
            <!-- The DISC button was here and was REMOVED 2026-08-18. Peter:
                 "DISC is deprecated, it is part of observatory" — and observatory,
                 including the mission-runner DISC existed to drive, is in
                 archive/observatory-and-discovery-2026-08-18.tar.gz.

                 THESE BUTTONS ARE HAND-WRITTEN, not generated from the backend's
                 mode vocabulary. I assumed they were, removed 'disc' from
                 MODE_KEYS, and the tab was still on screen — the screenshot
                 caught the assumption. Worth knowing: dropping a mode server-side
                 does NOT remove its button, and tab-cfg.html says the same thing
                 about the mode cards ("three hand-written cards"). -->

          </div>
        </div>
        <!-- The global TRACE switch was HERE and is deliberately gone.
             Peter, 2026-08-04: "the traceroute button that exists should not be
             there. traceroute is a node function and NOT a global switch."
             It was also a second owner of behaviour dash-mode owns: with it off,
             DISC ran and attempted nothing, and the only clue was a line in the
             mission runner's idle reason. Automatic tracing is now a property of
             the MODE (Config -> Modes -> aim/radio). Per-node tracing is the
             TRACE button on the node itself, which stays. -->
        
      </div>

      <!-- Mobile title + permanent spacer -->
      <div class="flex-1 flex items-center justify-center gap-3">
        <span class="text-base font-display font-bold tracking-wide uppercase lg:hidden">mesh radar</span>
      </div>

      <!-- RIGHT: az readout + status badges -->
      <div class="flex-none flex items-center gap-2">
        <!-- Az readout -->
        <span class="font-mono text-xs tabular-nums hidden sm:inline text-info"
              x-show="rotatorStatus.az != null"
              x-text="Number(rotatorStatus.az).toFixed(1) + '°'"></span>
        <!-- Per-device not-ready indicator — all devices shown in header -->
        <template x-for="dev in availableDevices.filter(d => { const k = d.node_id ?? d.addr; const s = devBleState(k); return s && s !== 'ready' && s !== 'offline'; })" :key="dev.addr">
          <div class="tooltip tooltip-bottom hidden md:block" :data-tip="(dev.node_id ?? dev.addr) + ' — ' + devBleLabel(dev.node_id ?? dev.addr)">
            <div class="badge badge-warning gap-1 text-xs animate-pulse">
              <span class="font-mono" x-text="deviceLabel(dev.node_id ?? dev.addr)"></span>
              <span x-text="devBleLabel(dev.node_id ?? dev.addr)"></span>
            </div>
          </div>
        </template>
        <div class="badge badge-sm badge-info hidden sm:inline-flex" x-text="nodeCount + ' nodes'"></div>
        <!-- The header RF badge is REMOVED — 2026-08-17, spec
             docs/modules/traceroute-removal-browser.md. It showed
             perfScore(), the median link-budget margin across
             traceroute_history rows, so with no traceroutes it had nothing
             to report. Worth rebuilding on whatever replaces the dispatcher:
             one number in the chrome saying how much headroom the station
             has was the most-glanced-at figure on the page. -->
        <!-- plugin: header -->
        <div class="badge badge-sm" :class="wsConnected ? 'badge-primary' : 'badge-ghost'" x-text="wsConnected ? 'live' : 'offline'"></div>
      </div>
    </div>

    <!-- Offline banner -->
    <div x-show="!serverReachable" x-transition class="bg-error text-error-content text-sm font-semibold text-center py-2 px-4 z-40">
      Bridge unreachable — retrying…
    </div>

    <!-- No device selected banner -->
    <div x-show="!activeNodeId && serverReachable" x-transition class="bg-warning text-warning-content text-sm font-semibold text-center py-2 px-4 z-40">
      No device selected — pick one from the sidebar
    </div>

    <!-- Main content — all tabs fill viewport, no page-level scroll -->
    <div class="flex-1 min-h-0 overflow-hidden">
      <div :class="tab==='radar' ? 'h-full flex flex-col' : 'h-full flex flex-col p-3 max-w-[1400px] w-full mx-auto'">

        <!-- Tabs are lazy-mounted (x-if): only the active tab's DOM + Alpine
             effects exist, so hidden tabs' x-for lists don't reconcile on every
             WS update (task lazy-tabs-xif). tab-shared is a node-info panel, not
             a tab — it stays always-mounted. -->
        <template x-if="tab==='overview'"><!-- include: tab-overview.html --></template>
        <template x-if="tab==='radar'"><!-- include: tab-radar.html --></template>
        <template x-if="tab==='snapshot'"><!-- include: tab-snapshot.html --></template>
        <!-- include: tab-shared.html -->
        <template x-if="tab==='nodes'"><!-- include: tab-nodes.html --></template>
        <template x-if="tab==='cfg'"><!-- include: tab-cfg.html --></template>
        <template x-if="tab==='perf'"><!-- include: tab-perf.html --></template>
        <template x-if="tab==='range'"><!-- include: tab-range.html --></template>
        <!-- plugin: tabs -->
        <template x-if="tab==='node'"><!-- include: tab-node.html --></template>

      </div>
    </div>

  </div>

  <!-- include: drawer-sidebar.html -->

</div>

<script src="/utils.js"></script>
<script>
  document.addEventListener('click', e => {
    document.querySelectorAll('details.dropdown[open]').forEach(d => {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });
</script>

</body>
</html>
